name: Astra one tap owner close fresh Telegram session UI mock and fail closed regressions
on:
  push:
    branches: [fix/owner-close-session-visibility-20261030, main]
    paths: [app.js,index.html,style.css,tests/owner-close-ui-test.cjs,.github/workflows/owner-close-fresh-telegram-session-safety.yml]
  pull_request:
    paths: [app.js,index.html,style.css,tests/owner-close-ui-test.cjs,.github/workflows/owner-close-fresh-telegram-session-safety.yml]
permissions:
  contents: read
jobs:
  ui-mock-no-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify real app JS semantics and mock front-end POST, no broker MT5
        run: |
          set -euo pipefail
          node --check app.js
          node --check config.js
          node tests/owner-close-ui-test.cjs
