name: Astra desktop Excel ribbon and responsive zoom safety
on:
  push:
    branches: [feat/excel-dark-ribbon-compact-fit-20261029]
    paths: [index.html,style.css,app.js,config.js,.github/workflows/excel-ribbon-fit-check.yml]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check JS, dark ribbon and white grid semantics
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check config.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          class Parser(HTMLParser):
              def __init__(self):super().__init__();self.ids=[];self.tabs=[];self.cols=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.append(a['id'])
                  if a.get('data-sheet'):self.tabs.append((a.get('data-sheet'),a.get('role')))
                  if tag=='col':self.cols+=1
          p=Parser();p.feed(html)
          assert len(p.ids)==len(set(p.ids)), 'duplicate id'
          assert p.tabs==[('trades','tab'),('signals','tab'),('status','tab')],p.tabs
          assert p.cols==21, '20 worksheet columns + 1 row index'
          assert all(x in p.ids for x in ['worksheet','sheet-scroller','sheet-body','fit-toggle','zoom-out','zoom-in','zoom-label','zoom-slider'])
          assert 'aria-pressed="false"' in html and 'aria-label="Masshtab foizi"' in html
          assert 'Главная' in html and 'Вставка' in html and 'Формулы' in html and 'Поиск' in html
          assert 'class="titlebar"' in html and 'class="ribbon"' in html and 'class="formula"' in html
          assert 'background:#121212' in css and 'background:#292929' in css
          assert '.worksheet th.rownum' in css and 'background:#fff' in css
          assert '.workbook.compact-mode .ribbon' in css
          assert 'function fitWorksheet()' in js and 'function setZoom(' in js and 'clientWidth' in js
          assert "const cols='ABCDEFGHIJKLMNOPQRST'" in js
          assert "while(body.childElementCount<34)" in js
          assert 'innerHTML' not in js and 'trade_executed!==false' in js
          assert all(x in js for x in ['api/positions','api/signals','api/close-request','X-Telegram-Init-Data','function renderTrades(','function renderSignals(','function renderStatus('])
          assert all(s not in (html+css+js+Path('config.js').read_text()).lower() for s in ['telegram_token','telegram_chat_id','expected_login','expected_server','begin private key'])
          print('EXCEL_DARK_RIBBON_WHITE_GRID_RESPONSIVE_UI_STATIC_PASS')
          PY
      - name: Exercise fit and percent zoom controls in a mock DOM without any network or broker
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('app.js','utf8');
          const a=src.indexOf('// Zoom is presentation-only');
          const b=src.indexOf("document.querySelectorAll('button[data-sheet]')",a);
          if(a<0||b<=a)throw Error('missing zoom control logic');
          const handlers={};const elements={};
          function button(id){return elements[id]??=({
            value:null,textContent:'',attrs:{},listeners:{},
            setAttribute(k,v){this.attrs[k]=v},
            addEventListener(k,cb){this.listeners[k]=cb}
          })}
          const book={classList:{enabled:false,add(x){if(x==='compact-mode')this.enabled=true},remove(x){if(x==='compact-mode')this.enabled=false}}};
          let scale=1;const sheet={style:{set zoom(v){scale=parseInt(v,10)/100},get zoom(){return String(scale*100)+'%'}},
            querySelectorAll(q){if(q!=='thead th')throw Error('unexpected DOM access');return [
              {getBoundingClientRect(){return {left:0}}},...Array.from({length:10},()=>({})),
              {getBoundingClientRect(){return {right:1180*scale}}}]}
          };
          const scroller={clientWidth:700,scrollLeft:99};
          const sandbox={
            document:{querySelector(sel){if(sel==='.workbook')return book;throw Error('unexpected '+sel)}},
            byId(id){if(id==='worksheet')return sheet;if(id==='sheet-scroller')return scroller;return button(id)},
            value(id,v){button(id).textContent=String(v)},
            window:{addEventListener(k,cb){handlers[k]=cb}},
            console,Math,Number,String
          };
          vm.runInNewContext(src.slice(a,b),sandbox);
          const click=id=>button(id).listeners.click();
          click('fit-toggle');
          if(!book.classList.enabled||button('fit-toggle').attrs['aria-pressed']!=='true')throw Error('fit compact toggle');
          if(button('zoom-label').textContent!=='55%')throw Error('fit expected 55% minimum while width 700/1180');
          if(scroller.scrollLeft!==0)throw Error('fit should reset horizontal position');
          click('fit-toggle');
          if(book.classList.enabled||button('zoom-label').textContent!=='100%')throw Error('fit reset');
          click('zoom-out');if(button('zoom-label').textContent!=='95%')throw Error('zoom out');
          click('zoom-in');if(button('zoom-label').textContent!=='100%')throw Error('zoom in');
          button('zoom-slider').listeners.input({target:{value:'75'}});
          if(button('zoom-label').textContent!=='75%')throw Error('slider');
          click('zoom-label');if(button('zoom-label').textContent!=='100%')throw Error('100 reset');
          console.log('EXCEL_FIT_ZOOM_INTERACTIONS_PASS');
          JS
