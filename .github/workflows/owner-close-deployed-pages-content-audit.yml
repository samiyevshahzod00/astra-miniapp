name: Astra one-tap close published Pages content source-identity READ ONLY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-close-deployed-pages-content-audit.yml','app.js','index.html','style.css']
permissions:
  contents: read
jobs:
  public-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify published JavaScript and visible session explanation equal reviewed main code, no API POST
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import URLError,HTTPError
          import hashlib,time,os
          public='https://samiyevshahzod00.github.io/astra-miniapp/'
          names=['app.js','index.html','style.css']
          expected={k:hashlib.sha256(Path(k).read_bytes()).hexdigest() for k in names}
          match=False;last={}
          for attempt in range(1,13):
              found={}
              for name in names:
                  try:
                      url=public+name+'?git_sha='+os.environ['GITHUB_SHA']
                      req=Request(url,headers={'Cache-Control':'no-cache','User-Agent':'AstraOwnerClosePublicAudit/1'})
                      with urlopen(req,timeout=10) as response:
                          body=response.read(250000)
                      found[name]=hashlib.sha256(body).hexdigest()
                  except (URLError,HTTPError,TimeoutError):
                      found[name]='HTTP_NOT_AVAILABLE'
              last=found
              if found==expected:
                  match=True
                  break
              time.sleep(10)
          assert match,'PUBLIC_PAGES_VERSION_NOT_YET_MATCHING_REVIEWED_SOURCE '+str({k:found.get(k)==v for k,v in expected.items()})
          app=Path('app.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'function closeSessionReady()' in app
          assert 'closeSessionHelp' in app and 'id="close-feedback"' in html
          assert 'broker_confirmed_full_close===true' in app
          print('ASTRA_PUBLIC_PAGES_ONE_TAP_FRESH_AUTH_WARNING_DEPLOYED_SOURCE_SHA_MATCH_PASS')
          print('STATIC_FILES_VERIFIED '+','.join(names))
          print('NO_BROKER_ORDER_OR_OWNER_SESSION_SENT')
          PY
