name: Astra spreadsheet UI static safety validation
on:
  push:
    branches: [feat/astra-grid-positions-signals-20261029]
    paths: ['index.html','app.js','style.css','config.js','.github/workflows/grid-ui-check.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse JavaScript and validate spreadsheet UI/action safeguards
        run: |
          node --check app.js
          node --check config.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          js=Path('app.js').read_text()
          css=Path('style.css').read_text()
          required=['trade-rows','signal-rows','signal-chart','close-profit','close-loss','close-all','floating','total-pnl','total-swap','tab-signals','tab-trades']
          assert all('id="'+tag+'"' in html for tag in required), 'missing interactive grid surface'
          assert all(word in js for word in ['api/positions','api/signals','api/close-request','showConfirm','queued_for_owner','trade_executed']), 'missing guarded actual action logic'
          assert 'credentials:\'omit\'' in js and 'X-Telegram-Init-Data' in js, 'owner HMAC transport missing'
          assert 'innerHTML' not in js, 'unsafe untrusted HTML insertion'
          assert '<script' in html and 'connect-src https:' in html
          assert 'position:sticky' in css and 'overflow-x:auto' in css, 'spreadsheet accessibility missing'
          assert all(item not in (html+js+css+Path('config.js').read_text()).lower() for item in ['telegram_token','expected_login','expected_server']), 'public secret or broker account data'
          print('ASTRA_GRID_UI_STATIC_SECURITY_PASS_NO_FAKE_BROKER_DATA')
          PY
